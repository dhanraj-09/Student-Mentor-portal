name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

# A newer push to the same branch makes an in-flight run redundant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: ['20.x', '22.x']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The backend and frontend both import `shared` through its built output,
      # so it has to be compiled before anything else is typechecked.
      - name: Build shared package
        run: npm run build -w shared

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Typecheck tests
        run: npm run typecheck:test -w backend

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  formatting:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - run: npm ci

      # Mirrors the lint-staged hook, for anyone who committed with it skipped.
      - name: Check formatting
        run: npx prettier --check .
