# The database is MySQL hosted on Aiven (remote), so no local DB service runs
# here — the backend connects out to DB_HOST over SSL using packages/backend/ca.pem.
services:
  backend:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
      target: development
    container_name: student_mentor_backend
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 8080
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-defaultdb}
      DB_SSL_CA: ${DB_SSL_CA:-ca.pem}
      DB_SSL_REJECT_UNAUTHORIZED: ${DB_SSL_REJECT_UNAUTHORIZED:-true}
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret}
      REFRESH_SECRET: ${REFRESH_SECRET:-dev-only-refresh-secret}
      ACCESS_TOKEN_EXPIRY: ${ACCESS_TOKEN_EXPIRY:-30m}
      REFRESH_TOKEN_EXPIRY: ${REFRESH_TOKEN_EXPIRY:-7d}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173}
      LIVEKIT_URL: ${LIVEKIT_URL:-}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      LIVEKIT_TOKEN_TTL_SECONDS: ${LIVEKIT_TOKEN_TTL_SECONDS:-300}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
    ports:
      - '${PORT:-8080}:8080'
    volumes:
      - ./packages/backend/src:/app/packages/backend/src
      - ./packages/shared/src:/app/packages/shared/src
      # Anonymous volume keeps the image's node_modules from being shadowed
      # by the host mount above.
      - /app/node_modules
    networks:
      - student_mentor_network

  frontend:
    build:
      context: .
      dockerfile: packages/frontend/Dockerfile
      target: development
    container_name: student_mentor_frontend
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
    ports:
      - '${FRONTEND_PORT:-5173}:5173'
    volumes:
      - ./packages/frontend/src:/app/packages/frontend/src
      - ./packages/shared/src:/app/packages/shared/src
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - student_mentor_network

networks:
  student_mentor_network:
    driver: bridge
